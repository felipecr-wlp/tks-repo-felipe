<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contador</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:transparent;color:#1e293b;padding:16px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;min-height:140px;display:flex;flex-direction:column;align-items:center}.title{font-size:13px;font-weight:600;color:#64748b;margin-bottom:12px}.counter{font-size:36px;font-weight:700;margin:4px 0}.btns{display:flex;gap:6px}.btn{padding:6px 16px;border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc;cursor:pointer;font-size:14px}.btn:hover{background:#f1f5f9}.btn.reset{font-size:12px}</style></head>
<body><div class="card"><div class="title">Contador</div><div class="counter" id="c">0</div><div class="btns"><button class="btn" onclick="u(-1)">-</button><button class="btn reset" onclick="u(0)">Reset</button><button class="btn" onclick="u(1)">+</button></div></div>
<script>let n=0;function u(d){n=d===0?0:n+d;document.getElementById('c').textContent=n;window.parent.postMessage({type:'wlo-resize',height:document.body.scrollHeight+20},'*')}window.addEventListener('load',()=>{window.parent.postMessage({type:'wlo-resize',height:document.body.scrollHeight+20},'*')})</script>
</body></html>
