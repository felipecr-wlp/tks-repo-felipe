<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reloj</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:transparent;color:#1e293b;padding:16px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;min-height:140px;display:flex;flex-direction:column;align-items:center}.title{font-size:13px;font-weight:600;color:#64748b;margin-bottom:12px}.time{font-size:36px;font-weight:700;font-family:monospace;margin:4px 0}.date{font-size:12px;color:#94a3b8}</style></head>
<body><div class="card"><div class="title">Reloj</div><div class="time" id="t">--:--:--</div><div class="date" id="d"></div></div>
<script>function tick(){const n=new Date();document.getElementById('t').textContent=n.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',second:'2-digit'});document.getElementById('d').textContent=n.toLocaleDateString('es-MX',{weekday:'long',year:'numeric',month:'long',day:'numeric'});window.parent.postMessage({type:'wlo-resize',height:document.body.scrollHeight+20},'*')}tick();setInterval(tick,1000);window.addEventListener('load',()=>{window.parent.postMessage({type:'wlo-resize',height:document.body.scrollHeight+20},'*')})</script>
</body></html>
